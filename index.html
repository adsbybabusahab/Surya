  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #030813;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 8px;
    }

    /* Main Container (Mobile Fit) */
    .card-container {
      background: #02060d;
      border: 1.5px solid #00d2ff;
      border-radius: 18px;
      width: 100%;
      max-width: 380px;
      padding: 14px 12px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.35), inset 0 0 12px rgba(0, 255, 136, 0.15);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Badge */
    .top-badge {
      border: 1px solid #00d2ff;
      border-radius: 20px;
      padding: 4px 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.8px;
      background: linear-gradient(90deg, rgba(0, 114, 255, 0.2), rgba(0, 255, 136, 0.2));
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
      margin: 0 auto 10px;
      width: fit-content;
    }

    /* Profile Image Section with Rotating Tricolor Dots */
    .profile-wrapper {
      position: relative;
      width: 125px;
      height: 125px;
      margin: 0 auto 10px;
      border-radius: 50%;
      border: 2.5px solid #00d2ff;
      padding: 4px;
      box-shadow: 0 0 18px #00d2ff, 0 0 10px #00ff88;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      position: relative;
      z-index: 2;
    }

    /* Rotating India Flag Dots Ring */
    .rotating-dots-ring {
      position: absolute;
      top: -12px;
      left: -12px;
      width: calc(100% + 24px);
      height: calc(100% + 24px);
      animation: spin 6s linear infinite;
      pointer-events: none;
      z-index: 3;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Headings */
    .title-gold {
      font-size: 26px;
      font-weight: 900;
      background: linear-gradient(180deg, #fff3a1 0%, #ffd700 45%, #b8860b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      line-height: 1.1;
      filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.8));
    }

    .title-blue {
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(180deg, #70cfff 0%, #0088ff 50%, #0044bb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 3px;
      filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.8));
    }

    .subtitle {
      color: #e0e0e0;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .members-count {
      background: linear-gradient(90deg, #00d2ff 0%, #00ff88 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 6px rgba(0, 210, 255, 0.4));
    }

    /* Grid Options (Compact for Mobile) */
    .features-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 14px;
    }

    .feature-card {
      border: 1px solid rgba(0, 210, 255, 0.45);
      border-radius: 9px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(145deg, rgba(0, 30, 60, 0.5), rgba(0, 40, 25, 0.35));
      box-shadow: inset 0 0 6px rgba(0, 210, 255, 0.15);
    }

    .feature-icon {
      font-size: 16px;
    }

    .feature-text {
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      text-align: left;
      line-height: 1.15;
    }

    /* CTA Button with Blue-Green Neon Gradient */
    .btn-join {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: linear-gradient(90deg, #0066ff 0%, #00d2ff 50%, #00ff88 100%);
      color: #000000;
      font-size: 17px;
      font-weight: 900;
      text-transform: uppercase;
      text-decoration: none;
      padding: 12px 0;
      border-radius: 25px;
      animation: blueGreenGlow 2s infinite ease-in-out;
      transition: transform 0.2s;
      letter-spacing: 0.5px;
    }

    .btn-join:active {
      transform: scale(0.97);
    }

    @keyframes blueGreenGlow {
      0% {
        box-shadow: 0 0 10px #00d2ff, 0 0 18px rgba(0, 255, 136, 0.5), inset 0 0 8px rgba(0,0,0,0.3);
      }
      50% {
        box-shadow: 0 0 20px #00d2ff, 0 0 35px #00ff88, inset 0 0 12px rgba(255,255,255,0.4);
      }
      100% {
        box-shadow: 0 0 10px #00d2ff, 0 0 18px rgba(0, 255, 136, 0.5), inset 0 0 8px rgba(0,0,0,0.3);
      }
    }

    /* Compact Footer */
    .footer-text {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(0, 210, 255, 0.2);
      font-size: 10px;
      color: #8f9ca8;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .ads-link {
      color: #ffd700;
      text-decoration: none;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 14px;
      background: rgba(255, 215, 0, 0.08);
      border: 1px solid rgba(255, 215, 0, 0.35);
      transition: all 0.2s ease;
    }

    /* Small Screen Adjustments (Height < 680px) */
    @media (max-height: 680px) {
      .profile-wrapper {
        width: 105px;
        height: 105px;
        margin-bottom: 6px;
      }
      .title-gold { font-size: 22px; }
      .title-blue { font-size: 20px; }
      .members-count { margin-bottom: 8px; font-size: 13px; }
      .features-grid { gap: 5px; margin-bottom: 10px; }
      .feature-card { padding: 4px 6px; }
      .btn-join { padding: 10px 0; font-size: 15px; }
      .card-container { padding: 10px; }
    }
  </style>
